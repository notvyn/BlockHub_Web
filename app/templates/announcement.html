{% extends 'base.html' %}

{% block content %}
    <h2>{{ announcement.title }}</h2>
    <p>Posted by: {{ announcement.author.name }} @ {{ announcement.date_posted }}</p>
    <div class="full-announcement-content">
        {{ announcement.content | markdown }}
    </div>

    {% if announcement.url %}
        <p>{{ announcement.url }}</p>
    {% endif %}
    
{% endblock %}
