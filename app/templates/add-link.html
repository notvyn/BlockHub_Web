{% extends 'base.html' %}

{% block content %}
    <h1>Add Link</h1>

    <form method="POST">
        {{ form.hidden_tag() }}

        {{ form.title.label() }}
        {{ form.title(placeholder="Enter Title") }}
        
        {{ form.url.label() }}
        {{ form.url(placeholder="Enter Url") }}

        {{ form.submit(value="Submit") }}
    </form>

{% endblock %}
